<!DOCTYPE html>
<html lang="ja">
<head>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="./nur.png" type="image/png">
  <link rel="apple-touch-icon" href="./nur.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Archive</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<div class="bg" id="bg" aria-hidden="true"></div>
<a class="bgcredit" id="bgcredit" target="_blank" rel="noopener" hidden></a>
<nav class="pagerbar" aria-label="Page navigation">
  <div class="pg"><a class="pager sm" id="pprev2" href="#/"></a><a class="pager" id="pprev" href="#/"></a></div>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="ダークモード">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    <span class="knob"></span>
  </button>
  <div class="pg"><a class="pager" id="pnext" href="#/"></a><a class="pager sm" id="pnext2" href="#/"></a></div>
</nav>
<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
<footer><div class="wrap"><span class="sub" id="copy"></span><span class="sub" id="upd"></span></div></footer>
<div class="cursor" id="cursor"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="画像の拡大表示" hidden>
  <button id="lbclose" aria-label="閉じる">×</button><button id="lbprev" aria-label="前の画像">‹</button><button id="lbnext" aria-label="次の画像">›</button>
  <figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure>
</div>

<script src="./src/app.js"></script>
</body>
</html>
