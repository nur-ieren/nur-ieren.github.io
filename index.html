<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" href="./nur.png" type="image/png">
  <link rel="nur" href="./nur.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Archive</title>
<style>
/* ============================================================
   CSS 構成
     1. tokens   2. base   3. layout(pager / page / footer)
     4. components(card / tag / rows / timeline / filters / home)
     5. media(image slider / logos / music)
     6. overlays(lightbox / cursor)
     7. backgrounds(page / section)
     8. quiz   9. reduced motion
   ============================================================ */

/* ---------- 1. tokens ---------- */
:root{
  --color-paper:#F4F0E8;--color-surface:#EAE4D9;--color-ink:#292823;--color-muted:#6b675e;--color-line:#D6CFC2;--color-accent:#A64F38;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Noto Sans Mono CJK JP","Hiragino Sans","Yu Gothic",monospace;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.25rem;--text-xl:1.75rem;--text-display:clamp(2rem,5vw,4.5rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;--space-16:4rem;--space-24:6rem;
  --content-width:72rem;--reading-width:42rem;--page-gutter:clamp(1.25rem,5vw,4rem);
  --border-width:1px;--radius-sm:.25rem;--radius-md:.5rem;
  --ease-out:cubic-bezier(.16,1,.3,1);--duration-fast:160ms;--duration-normal:320ms;--duration-slow:560ms;
}

/* ---------- 2. base ---------- */
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-mono);font-size:var(--text-base);line-height:1.9;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
a{color:var(--color-ink);text-decoration:underline;text-decoration-color:var(--color-line);text-underline-offset:.3em;transition:color var(--duration-fast),text-decoration-color var(--duration-fast)}
a:hover{color:var(--color-accent);text-decoration-color:var(--color-accent)}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--content-width);margin:0 auto;padding:0 var(--page-gutter)}
.sub{font-size:var(--text-xs);color:var(--color-muted);letter-spacing:.04em;line-height:1.6}
[data-k]{scroll-margin-top:3.5rem} /* Randomで開いた項目を上端に寄せるときの余白 */

/* ---------- 3. layout ---------- */
/* pager: ページ最上部の左右ナビ(スクロールには付いてこない) */
.pagerbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + .75rem);left:calc(var(--page-gutter) - .75rem);right:calc(var(--page-gutter) - .75rem);z-index:20;display:flex;justify-content:space-between;align-items:baseline;pointer-events:none}
.pg{display:flex;align-items:baseline;gap:var(--space-1)}
.pager{pointer-events:auto;display:inline-flex;align-items:center;gap:var(--space-1);padding:.4rem .75rem;font-size:var(--text-sm);line-height:1.4;color:var(--color-ink);text-decoration:none;white-space:nowrap;border-radius:var(--radius-sm);transition:color var(--duration-fast)}
.pager.sm{padding:.4rem .4rem;font-size:var(--text-xs);color:var(--color-muted)}
.pager:hover{color:var(--color-accent)}
.pager[hidden]{display:none} /* Peripheralなど一周の外のページでは隠す */
.pager i{font-style:normal;display:inline-block;transition:transform var(--duration-normal) var(--ease-out)}
.pg:first-child .pager:hover i{transform:translateX(-4px)}
.pg:last-child .pager:hover i{transform:translateX(4px)}
/* page */
main{padding-top:6rem;min-height:calc(100vh - 8rem);outline:none}
.view{animation:rise var(--duration-slow) var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page h1{font-size:clamp(1.75rem,4vw,2.5rem);font-weight:500;margin:0 0 var(--space-12);line-height:1.3}
h2.sec{font-size:var(--text-lg);font-weight:500;margin:0 0 var(--space-6);padding-bottom:var(--space-3);border-bottom:var(--border-width) solid var(--color-line);display:flex;justify-content:space-between;align-items:baseline}
section.blk{margin-top:var(--space-16)}
section.blk.tight{margin-top:var(--space-8)}
/* footer */
footer{margin-top:var(--space-24);border-top:var(--border-width) solid var(--color-line);padding:var(--space-6) 0 var(--space-12)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-3)}

/* ---------- 4. components ---------- */
/* home */
.home{text-align:center;padding:var(--space-12) 0 var(--space-16)}
.avatar{width:7rem;height:7rem;border-radius:50%;background:var(--color-surface);border:var(--border-width) solid var(--color-line);margin:0 auto var(--space-8);display:grid;place-items:center;color:var(--color-muted);font-size:var(--text-xl);overflow:hidden;transition:transform var(--duration-slow) var(--ease-out)}
.avatar:hover{transform:rotate(-6deg) scale(1.04)}
.avatar img{width:100%;height:100%;object-fit:cover}
h1.name{font-size:var(--text-display);font-weight:500;line-height:1.1;margin:0;letter-spacing:-.02em}
.phon{margin:var(--space-3) 0 var(--space-8)}
.intro{max-width:var(--reading-width);margin:0 auto;color:var(--color-ink)}
.stagger>*{opacity:0;animation:rise var(--duration-slow) var(--ease-out) forwards;animation-delay:calc(var(--i)*90ms)}
/* grid + card */
.grid{display:grid;gap:var(--space-4);grid-template-columns:1fr}
@media(min-width:40rem){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:64rem){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;background:rgba(234,228,217,var(--card-alpha,1));border:var(--border-width) solid var(--color-line);border-radius:var(--radius-md);padding:var(--space-6);text-decoration:none;text-align:left;transition:transform 200ms var(--ease-out),border-color var(--duration-fast);line-height:1.7}
.card:hover{transform:translateY(-3px);border-color:var(--color-accent);color:var(--color-ink)}
.card h3{margin:var(--space-2) 0;font-size:var(--text-base);font-weight:500}
.card p{margin:0 0 var(--space-3);font-size:var(--text-sm);color:var(--color-muted)}
.tag{display:inline-block;font-size:var(--text-xs);border:var(--border-width) solid var(--color-line);border-radius:99px;padding:0 .6rem;margin:0 .3rem .3rem 0;color:var(--color-muted)}
.status{color:var(--color-accent)}
/* Random */
.rand{font:inherit;font-size:var(--text-sm);background:none;color:var(--color-ink);border:var(--border-width) solid var(--color-ink);border-radius:var(--radius-sm);padding:.5rem 1rem;cursor:pointer;transition:background var(--duration-fast),color var(--duration-fast)}
.rand:hover{background:var(--color-ink);color:var(--color-paper)}
#disc{margin-top:var(--space-4);min-height:4rem}
/* prose / timeline */
.prose{max-width:var(--reading-width)}
.prose p{margin:0 0 var(--space-4);font-size:var(--text-sm)}
.tl{list-style:none;margin:0;padding:0;border-left:var(--border-width) solid var(--color-line)}
.tl li{display:grid;grid-template-columns:6rem 1fr;gap:var(--space-4);padding:0 0 var(--space-6) var(--space-4);position:relative;font-size:var(--text-sm)}
.tl li::before{content:"";position:absolute;left:-4px;top:.75rem;width:7px;height:7px;border-radius:50%;background:var(--color-accent)}
/* rows(Interests / Links) */
.rows .sub{white-space:pre-line}
.rows .row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-4) 0;border-bottom:var(--border-width) solid var(--color-line);font-size:var(--text-sm)}
.rows a.row{text-decoration:none;transition:padding var(--duration-fast)}
.rows a.row:hover{padding-left:.5rem}
.rows a.row span:last-child{color:var(--color-muted)}
/* Works filters */
.filters{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-6)}
.filters button{font:inherit;font-size:var(--text-xs);background:none;border:var(--border-width) solid var(--color-line);border-radius:99px;padding:.2rem .8rem;color:var(--color-ink);cursor:pointer;transition:all var(--duration-fast)}
.filters button[aria-pressed=true]{background:var(--color-ink);color:var(--color-paper);border-color:var(--color-ink)}

/* ---------- 5. media ---------- */
/* text + image slider row(Interests / Peripheral) */
.irow{display:flex;gap:var(--space-6);align-items:flex-start;padding:var(--space-4) 0;border-bottom:var(--border-width) solid var(--color-line);font-size:var(--text-sm)}
.irow b{font-weight:500}
.itxt{flex:1 1 auto;min-width:0}
.pics{flex:0 0 auto;display:flex;gap:var(--space-2);max-width:calc(3.5*4.5rem + 3*var(--space-2) + 4px);padding:4px 2px .5rem;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--color-line) transparent}
.pic{flex:0 0 4.5rem;width:4.5rem;height:4.5rem;display:block;border-radius:.875rem;overflow:hidden;border:var(--border-width) solid var(--color-line);background:var(--color-surface);scroll-snap-align:start;text-decoration:none;transition:transform 200ms var(--ease-out),border-color var(--duration-fast)}
button.pic{padding:0;font:inherit;cursor:zoom-in}
.pic:hover{transform:translateY(-2px);border-color:var(--color-accent)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
@media(max-width:40rem){.irow{flex-direction:column;gap:var(--space-3)}.pics{max-width:100%;width:100%}}
/* Links: service logo */
.lk{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.ico{flex:0 0 auto;width:1.75rem;height:1.75rem;display:grid;place-items:center;border-radius:.45rem;overflow:hidden;border:var(--border-width) solid var(--color-line);background:var(--color-surface);font-style:normal;font-size:var(--text-xs);line-height:1;color:var(--color-muted)}
.ico.ph{border-style:dashed}
.ico img{display:block;width:100%;height:100%;object-fit:cover}
/* Spotify embeds */
.music{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr))}
.sp{display:block;width:100%;border:0;border-radius:12px;background:var(--color-surface)}
.sp-empty{min-height:12rem;display:grid;place-items:center;align-content:center;gap:var(--space-2);text-align:center;padding:var(--space-6);border:var(--border-width) dashed var(--color-line);border-radius:12px;background:var(--color-surface)}
.sp-empty b{font-weight:500;font-size:var(--text-sm)}

/* ---------- 6. overlays ---------- */
/* lightbox */
.lb{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:var(--space-12) var(--space-4);background:rgba(41,40,35,.88)}
.lb[hidden]{display:none}
.lb figure{margin:0;display:grid;justify-items:center;gap:var(--space-3);max-width:min(92vw,60rem)}
.lb figcaption{color:var(--color-paper);font-size:var(--text-sm);line-height:1.7;text-align:center;white-space:pre-line}
.lb figcaption:empty{display:none}
.lb img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:.875rem;background:var(--color-surface);animation:rise var(--duration-normal) var(--ease-out) both}
.lb button{position:absolute;z-index:2;font:inherit;font-size:var(--text-lg);line-height:1;color:var(--color-paper);background:rgba(41,40,35,.55);border:var(--border-width) solid rgba(244,240,232,.5);backdrop-filter:blur(4px);border-radius:99px;width:2.75rem;height:2.75rem;cursor:pointer;transition:background var(--duration-fast)}
.lb button:hover{background:rgba(41,40,35,.8)}
#lbclose{top:calc(env(safe-area-inset-top,0px) + 1rem);right:1rem}
#lbprev{left:1rem;top:50%;transform:translateY(-50%)}
#lbnext{right:1rem;top:50%;transform:translateY(-50%)}
.lb.single #lbprev,.lb.single #lbnext{display:none}
/* cursor dot(デスクトップのみ) */
.cursor{position:fixed;width:.5rem;height:.5rem;border-radius:50%;background:var(--color-accent);opacity:0;pointer-events:none;z-index:50;transition:opacity var(--duration-normal)}
@media(hover:none),(pointer:coarse){.cursor{display:none}}

/* ---------- 7. backgrounds ---------- */
/* page background */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity var(--duration-normal)}
.bgcredit{position:fixed;right:.75rem;bottom:calc(env(safe-area-inset-bottom,0px) + .5rem);z-index:5;max-width:calc(100vw - 1.5rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.6875rem;line-height:1.5;color:var(--color-muted);text-decoration:none;padding:.15rem .4rem;border-radius:var(--radius-sm);background:rgba(244,240,232,.7)}
.bgcredit:hover{color:var(--color-accent)}
.bgcredit[hidden]{display:none}
/* section background */
section.blk.hasbg{position:relative;isolation:isolate}
.secbg{position:absolute;inset:-1rem;z-index:-1;border-radius:var(--radius-md);background-position:center;background-size:cover;background-repeat:no-repeat;pointer-events:none}
.bgurl{position:absolute;right:-.5rem;bottom:-.9rem;z-index:1;max-width:min(24rem,100%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .4rem;font-size:.625rem;line-height:1.6;letter-spacing:.02em;color:var(--color-muted);text-decoration:none;background:rgba(244,240,232,.75);border-radius:var(--radius-sm)}
.bgurl:hover{color:var(--color-accent)}

/* ---------- 8. quiz ---------- */
.card.quiz:hover{transform:none;border-color:var(--color-line)}
.card.quiz.win{animation:win 700ms var(--ease-out)}
@keyframes win{0%{box-shadow:0 0 0 0 rgba(166,79,56,.55)}100%{box-shadow:0 0 0 18px rgba(166,79,56,0)}}
.qopts{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin:var(--space-3) 0}
.qbtn{font:inherit;font-size:var(--text-sm);line-height:1.4;padding:.45rem .5rem;color:var(--color-ink);background:none;border:var(--border-width) solid var(--color-line);border-radius:var(--radius-sm);cursor:pointer;transition:background var(--duration-fast),color var(--duration-fast),border-color var(--duration-fast),opacity var(--duration-fast)}
.qbtn:hover:not(:disabled){border-color:var(--color-ink)}
.qbtn.ok{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-paper);cursor:pointer}
.qbtn.ng{opacity:.4;text-decoration:line-through;cursor:default}
.qbtn:disabled:not(.ok):not(.ng){opacity:.4;cursor:default}
.qbtn.shake{animation:shake 360ms}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qmsg{min-height:1.7em;font-size:var(--text-sm)}

/* ---------- 9. reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}
  .cursor{display:none}
}
</style>
</head>

<script>
/* ============================================================
   App code 表示内容は上の SITE / PAGES で定義する
     1. utils            2. templates        3. pages
     4. lightbox         5. page navigation(keyboard / swipe)
     6. quiz             7. backgrounds(section / page / preload)
     8. router           9. cursor dot
   ============================================================ */

/* ---------- 1. utils ---------- */
const $ = s => document.querySelector(s);
const ESC = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"};
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ESC[c]);
const clamp01 = n => Math.min(1, Math.max(0, +n));
const shortUrl = u => String(u).replace(/^https?:\/\//, "");
const idle = fn => (window.requestIdleCallback || (f => setTimeout(f, 200)))(fn);
const prefersReducedMotion = () => matchMedia("(prefers-reduced-motion:reduce)").matches;
const paras = list => [].concat(list || []).map(p => `<p>${esc(p)}</p>`).join("");
const body = document.body;

/* ---------- 2. templates ---------- */
const head = t => `<h1>${t}</h1>`;
const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : text;

const workCard = w => {
  const tag = w.url ? "a" : "div";
  const attrs = w.url ? ` href="${esc(w.url)}" target="_blank" rel="noopener"` : "";
  const tags = (w.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  return `<${tag} class="card"${attrs} data-k="w:${esc(w.title)}"><span class="sub">${esc(w.date)} / <span class="status">${esc(w.status)}</span></span><h3>${esc(w.title)}</h3><p>${esc(w.description)}</p>${tags}</${tag}>`;
};

/* 角丸の正方形サムネ列。クリックで拡大(data-* を lightbox が読む) */
const pics = list => {
  list = (list || []).filter(x => x && x.src);
  if (!list.length) return "";
  const items = list.map(x => `<button type="button" class="pic" data-src="${esc(x.full || x.src)}" data-cap="${esc(x.caption ?? x.alt)}" aria-label="${esc(x.alt || "画像")}を拡大"><img src="${esc(x.src)}" alt="${esc(x.alt)}" loading="lazy"></button>`);
  return `<div class="pics">${items.join("")}</div>`;
};

/* Links のサービスロゴ。未設定なら頭文字の仮アイコン */
const logo = l => l.logo
  ? `<i class="ico"><img src="${esc(l.logo)}" alt="" loading="lazy"></i>`
  : `<i class="ico ph" aria-hidden="true">${esc([...String(l.label || "?")][0].toUpperCase())}</i>`;

/* Spotify の通常URL → 埋め込みURL。Spotify 以外は "" */
const spEmbed = u => {
  try {
    const x = new URL(u);
    if (x.hostname !== "open.spotify.com") return "";
    let p = x.pathname.replace(/^\/intl-[a-zA-Z-]+/, "");
    if (!p.startsWith("/embed/")) p = "/embed" + p;
    return "https://open.spotify.com" + p + "?utm_source=generator";
  } catch (e) { return ""; }
};
const musicItem = m => {
  const src = spEmbed(m.url), title = esc(m.title || "Spotify");
  return src
    ? `<iframe class="sp" src="${esc(src)}" height="${+m.height || 352}" title="${title}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`
    : `<div class="sp-empty"><b>${title}</b><span class="sub">Spotify URL 未設定</span></div>`;
};
const musicSection = () =>
  `<section class="blk"><h2 class="sec">My Favorite Musics</h2><div class="music">${(SITE.music || []).map(musicItem).join("")}</div></section>`;

const quizCard = () => {
  const Q = SITE.quiz || {};
  if (!(Q.choices || []).length) return "";
  const buttons = Q.choices.map(c => `<button type="button" class="qbtn" data-q="${esc(c)}">${esc(c)}</button>`).join("");
  return `<div class="card quiz" id="quiz"><h3>${esc(Q.title || "Quiz")}</h3><p>${esc(Q.question)}</p><div class="qopts">${buttons}</div><div class="qmsg" id="qmsg" aria-live="polite"></div></div>`;
};

const interestRow = i =>
  `<div class="irow" data-k="i:${esc(i.label)}"><div class="itxt"><b>${link(i.url, esc(i.label))}</b><div class="sub">${esc(i.note)}</div></div>${pics(i.images)}</div>`;

const linkRow = l => l.url
  ? `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="lk">${logo(l)}${esc(l.label)}</span><span>${esc(l.handle)}</span></a>`
  : `<div class="row"><span class="lk">${logo(l)}${esc(l.label)}</span><span class="sub">${esc(l.handle)}</span></div>`;

const peripheralEntry = e =>
  `<section class="blk"><h2 class="sec">${esc(e.title)}</h2><div class="irow"><div class="itxt prose">${paras(e.body)}</div>${pics(e.images)}</div></section>`;

/* ---------- 3. pages ---------- */
const VIEWS = {
  home: () => {
    const S = SITE, featured = S.works.filter(w => w.featured);
    return `<div class="home stagger"><div class="avatar" style="--i:0">${S.avatarImage ? `<img src="${esc(S.avatarImage)}" alt="">` : esc(S.initial)}</div>
 <h1 class="name" style="--i:1">${esc(S.name)}</h1><div class="phon sub" style="--i:2">${esc(S.phonetic)}</div><p class="intro" style="--i:3">${esc(S.tagline)}</p></div>
 <section class="blk"><h2 class="sec">Selected Works<a class="sub" href="#/works">all works</a></h2><div class="grid">${featured.map(workCard).join("")}</div></section>
 <section class="blk"><h2 class="sec">Discovery</h2><div class="grid">
 <a class="card" href="#/peripheral"><h3>Peripheral</h3><p>${esc((S.peripheral || {}).blurb || "")}</p></a>
 ${quizCard()}
 <div class="card"><h3>Random</h3><p>サイト内から1つ紹介します。</p><button class="rand" id="rand">Show one</button><div id="disc" aria-live="polite"></div></div></div></section>
 ${musicSection()}`;
  },

  about: () => {
    const a = SITE.about;
    return `<div class="page">${head("About")}<div class="prose">${paras(a.body)}</div>
 <section class="blk"><h2 class="sec">Currently</h2><div class="prose">${paras(a.now)}</div></section>
 <section class="blk"><h2 class="sec">Archive</h2><ul class="tl">${a.timeline.map(t => `<li><span class="sub">${esc(t.date)}</span><span>${esc(t.text)}</span></li>`).join("")}</ul></section></div>`;
  },

  works: () => {
    const tags = [...new Set(SITE.works.flatMap(w => w.tags || []))];
    const filters = tags.map(t => `<button aria-pressed="false" data-t="${esc(t)}">${esc(t)}</button>`).join("");
    return `<div class="page">${head("Works")}<div class="filters" id="flt"><button aria-pressed="true" data-t="">All</button>${filters}</div><div class="grid" id="wg">${SITE.works.map(workCard).join("")}</div></div>`;
  },

  interests: () => {
    const sections = SITE.interests.map(c =>
      `<section class="blk tight"><h2 class="sec">${esc(c.category)}</h2><div class="rows">${c.items.map(interestRow).join("")}</div></section>`);
    return `<div class="page">${head("Interests")}${sections.join("")}</div>`;
  },

  links: () =>
    `<div class="page">${head("Links")}<div class="rows">${SITE.links.map(linkRow).join("")}</div></div>`,

  peripheral: () => {
    const E = (SITE.peripheral || {}).entries || [];
    const content = E.length ? E.map(peripheralEntry).join("") : `<div class="prose"><p class="sub">まだ何も置いていません。</p></div>`;
    return `<div class="page">${head("Peripheral")}${content}</div>`;
  }
};

/* ---------- 4. lightbox ---------- */
const lb = $("#lb"), lbImg = $("#lbimg"), lbCap = $("#lbcap");
let lbList = [], lbIdx = 0, lbFrom = null;

function lbShow(i) {
  lbIdx = (i + lbList.length) % lbList.length;
  const b = lbList[lbIdx];
  lbImg.src = b.dataset.src;
  lbCap.textContent = b.dataset.cap || "";
  lb.classList.toggle("single", lbList.length < 2);
}
function lbOpen(b) {
  lbList = [...b.closest(".pics").querySelectorAll(".pic")];
  lbFrom = b;
  lb.hidden = false;
  body.classList.add("lock");
  lbShow(lbList.indexOf(b));
  $("#lbclose").focus();
}
function lbClose() {
  lb.hidden = true;
  lbImg.removeAttribute("src");
  body.classList.remove("lock");
  if (lbFrom) lbFrom.focus({preventScroll: true});
}
/* クリックの振り分け(サムネ → 拡大 / 拡大中のボタン・背景 / クイズ) */
document.addEventListener("click", e => {
  const pic = e.target.closest(".pic");
  if (pic && pic.dataset.src) return lbOpen(pic);
  if (!lb.hidden) {
    if (e.target.closest("#lbprev")) lbShow(lbIdx - 1);
    else if (e.target.closest("#lbnext")) lbShow(lbIdx + 1);
    else if (e.target === lb || e.target.closest("#lbclose")) lbClose();
    return;
  }
  const qbtn = e.target.closest(".qbtn");
  if (qbtn) quizAnswer(qbtn);
});

/* ---------- 5. page navigation ---------- */
const goPager = id => { const a = $(id); if (a && !a.hidden) location.hash = a.getAttribute("href"); };

/* keyboard: 拡大中は画像送り / それ以外は ←→ で前後のページ(入力欄・修飾キー併用時は無効) */
document.addEventListener("keydown", e => {
  if (!lb.hidden) {
    if (e.key === "Escape") lbClose();
    if (e.key === "ArrowLeft") lbShow(lbIdx - 1);
    if (e.key === "ArrowRight") lbShow(lbIdx + 1);
    return;
  }
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  goPager(e.key === "ArrowLeft" ? "#pprev" : "#pnext");
});

/* swipe(スマホ): 左へ払う=次 / 右へ払う=前。
   画像スライダー・拡大表示中・ピンチ拡大中・画面の両端(OSの戻る操作)・文字選択中は無効 */
(() => {
  const SWIPE = {minDx: 70, maxMs: 700, ratio: 1.8, edge: 24};
  const IGNORE = ".pics,iframe,input,textarea,select,[contenteditable]";
  let x0 = 0, y0 = 0, t0 = 0, ok = false;
  addEventListener("touchstart", e => {
    const t = e.touches[0];
    ok = e.touches.length === 1 && lb.hidden
      && !(window.visualViewport && visualViewport.scale > 1.01)
      && t.clientX > SWIPE.edge && t.clientX < innerWidth - SWIPE.edge
      && !e.target.closest(IGNORE);
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, {passive: true});
  addEventListener("touchend", e => {
    if (!ok) return;
    ok = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Date.now() - t0 > SWIPE.maxMs || Math.abs(dx) < SWIPE.minDx || Math.abs(dx) < Math.abs(dy) * SWIPE.ratio || String(getSelection())) return;
    goPager(dx < 0 ? "#pnext" : "#pprev");
  }, {passive: true});
  addEventListener("touchcancel", () => { ok = false; }, {passive: true});
})();

/* ---------- 6. quiz ---------- */
function confetti(x, y) {
  if (prefersReducedMotion()) return;
  const cv = document.createElement("canvas"), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
  document.body.append(cv);
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  const colors = ["#A64F38", "#292823", "#E3A857", "#7C9A7E", "#C98B9B", "#6F8FB5"];
  const pieces = Array.from({length: 110}, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = 5 + Math.random() * 9;
    return {x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
            r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: colors[Math.floor(Math.random() * colors.length)], round: Math.random() < .3};
  });
  let frame = 0;
  (function tick() {
    g.clearRect(0, 0, W, H);
    frame++;
    pieces.forEach(p => {
      p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save();
      g.globalAlpha = Math.max(0, 1 - frame / 120);
      g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, 6.28); g.fill(); }
      else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    });
    if (frame < 120) requestAnimationFrame(tick); else cv.remove();
  })();
}
function quizAnswer(b) {
  const Q = SITE.quiz || {}, card = b.closest(".quiz"), msg = card.querySelector("#qmsg");
  if (b.dataset.q !== Q.answer) {
    b.disabled = true;
    b.classList.add("ng", "shake");
    msg.textContent = Q.wrong || "ちがうよ～";
    return;
  }
  card.querySelectorAll(".qbtn").forEach(x => { x.classList.remove("shake"); if (x !== b) x.disabled = true; });
  b.classList.add("ok");
  card.classList.remove("win"); void card.offsetWidth; card.classList.add("win"); /* アニメーションを再生し直す */
  msg.textContent = (Q.right || "正解！") + (Q.explain ? " " + Q.explain : "");
  const r = b.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2);
}

/* ---------- 7. backgrounds ---------- */
document.documentElement.style.setProperty("--card-alpha", clamp01(SITE.cardOpacity ?? 1));

/* section: セクション見出しをキーにして sectionBg の画像を敷く */
function applySectionBgs(root) {
  root.querySelectorAll("section.blk").forEach(sec => {
    const h = sec.querySelector("h2.sec"), title = h && h.firstChild ? h.firstChild.textContent.trim() : "";
    const c = (SITE.sectionBg || {})[title];
    if (!c || !c.src) return;
    sec.classList.add("hasbg");
    const d = document.createElement("div");
    d.className = "secbg";
    d.setAttribute("aria-hidden", "true");
    d.style.backgroundImage = `url("${String(c.src).replace(/"/g, "%22")}")`;
    d.style.opacity = clamp01(c.opacity ?? SITE.sectionBgOpacity ?? .15);
    sec.prepend(d);
    if (c.url) {
      const a = document.createElement("a");
      a.className = "bgurl"; a.href = c.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = shortUrl(c.url); a.title = c.url;
      sec.append(a);
    }
  });
}

/* page: ページ別・PC/スマホ別。slide=true ならスクロール量に合わせて画像をスライド */
const bgEl = $("#bg"), bgCredit = $("#bgcredit"), bgMq = matchMedia("(max-width:40rem)");
let bgKey = "home", bgSlide = false;

function bgPos() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = bgSlide && max > 0 ? clamp01(scrollY / max) : 0;
  bgEl.style.backgroundSize = bgSlide ? "100% auto" : "cover";
  bgEl.style.backgroundPosition = bgSlide ? `50% ${p * 100}%` : "50% 50%";
}
function setBg(key) {
  bgKey = key;
  const B = SITE.bg || {}, c = B[key] || {}, sl = B.slide || {}, mobile = bgMq.matches;
  const img = mobile ? c.mobile : c.pc;
  bgSlide = mobile ? !!sl.mobile : sl.pc !== false;
  bgEl.style.backgroundImage = img ? `url(${JSON.stringify(img)})` : "none";
  bgEl.style.opacity = c.opacity ?? B.opacity ?? .15;
  bgPos();
  if (img && c.url) { bgCredit.href = c.url; bgCredit.textContent = shortUrl(c.url); bgCredit.hidden = false; }
  else bgCredit.hidden = true;
}
let bgTick = 0;
const bgRequest = () => { if (!bgTick) bgTick = requestAnimationFrame(() => { bgTick = 0; bgPos(); }); };
addEventListener("scroll", bgRequest, {passive: true});
addEventListener("resize", bgRequest);
new ResizeObserver(bgRequest).observe(body);

/* preload: 他ページの背景も先に読み込み・デコードして、移動時の読み込み待ちをなくす */
const bgCache = new Map();
function bgPreload() {
  const B = SITE.bg || {}, side = bgMq.matches ? "mobile" : "pc";
  const keys = [bgKey, ...PAGES.map(p => p[0]), "peripheral"];
  const urls = keys.map(k => (B[k] || {})[side]).filter(Boolean);
  Object.values(SITE.sectionBg || {}).forEach(c => { if (c && c.src) urls.push(c.src); });
  urls.forEach(u => {
    if (bgCache.has(u)) return;
    const im = new Image();
    im.decoding = "async";
    im.src = u;
    bgCache.set(u, im);
    if (im.decode) im.decode().catch(() => {});
  });
}
const bgPreloadIdle = () => idle(bgPreload);
bgMq.addEventListener("change", () => { setBg(bgKey); bgPreloadIdle(); });

/* ---------- 8. router ---------- */
const TITLES = Object.fromEntries([...PAGES, ["peripheral", "Peripheral"]]);
let goal = null; /* Randomで選ばれた項目。遷移後にその項目を画面最上部へ出す */

/* 左上/右上のページ送り。一周の外(Peripheral)は「← Home」だけ */
function updatePager(key) {
  const ci = PAGES.findIndex(p => p[0] === key), ring = ci >= 0;
  const at = d => PAGES[(ci + d + PAGES.length * 2) % PAGES.length];
  const set = (id, pg, left, label) => {
    const a = $(id);
    a.href = "#/" + pg[0];
    a.innerHTML = left ? `<i aria-hidden="true">←</i><span>${pg[1]}</span>` : `<span>${pg[1]}</span><i aria-hidden="true">→</i>`;
    a.setAttribute("aria-label", label + ": " + pg[1]);
  };
  ["#pprev2", "#pnext", "#pnext2"].forEach(id => { $(id).hidden = !ring; });
  if (ring) {
    set("#pprev", at(-1), true, "前のページ");
    set("#pprev2", at(-2), true, "2つ前のページ");
    set("#pnext", at(1), false, "次のページ");
    set("#pnext2", at(2), false, "2つ先のページ");
  } else set("#pprev", ["home", "Home"], true, "ホームへ戻る");
}

/* Random で選ばれた項目を画面の最上部へ(ページ末尾の項目でも上端に届くよう下に余白を足す) */
function scrollToGoal(view) {
  if (!goal) return;
  const g = goal;
  goal = null;
  const el = [...view.querySelectorAll("[data-k]")].find(e => e.dataset.k === g);
  if (!el) return;
  const margin = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
  const top = Math.max(0, el.getBoundingClientRect().top + scrollY - margin);
  const extra = top + innerHeight - document.documentElement.scrollHeight;
  if (extra > 0) view.style.paddingBottom = extra + "px";
  scrollTo(0, top);
}

/* Home: Random */
function bindRandom() {
  const btn = $("#rand");
  if (!btn) return;
  btn.onclick = () => {
    const pool = [
      ...SITE.works.map(w => ["Works", w.title, w.description, "#/works", "w:" + w.title]),
      ...SITE.interests.flatMap(c => c.items.map(i => ["Interests", i.label, i.note, "#/interests", "i:" + i.label]))
    ];
    const [kind, title, text, href, key] = pool[Math.floor(Math.random() * pool.length)];
    const box = $("#disc");
    box.innerHTML = `<span class="sub">${esc(kind)}</span><div>${esc(title)}</div><a class="sub" href="${href}" data-go="${esc(key)}">open</a>`;
    box.querySelector("[data-go]").onclick = e => { goal = e.currentTarget.dataset.go; };
  };
}

/* Works: タグ絞り込み */
function bindFilters() {
  const bar = $("#flt");
  if (!bar) return;
  bar.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    bar.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const t = b.dataset.t;
    $("#wg").innerHTML = SITE.works.filter(w => !t || (w.tags || []).includes(t)).map(workCard).join("");
  };
}

function route() {
  const hash = location.hash.replace(/^#\/?/, "") || "home";
  const key = VIEWS[hash] ? hash : "home";
  const view = $("#view");
  view.style.paddingBottom = "";
  view.innerHTML = `<div class="view">${VIEWS[key]()}</div>`;
  document.title = (key === "home" ? "" : TITLES[key] + " | ") + SITE.name;
  applySectionBgs(view);
  updatePager(key);
  setBg(key);
  bgPreloadIdle();
  scrollTo(0, 0);
  $("#main").focus({preventScroll: true});
  scrollToGoal(view);
  bindRandom();
  bindFilters();
}
addEventListener("hashchange", route);
$("#copy").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
$("#upd").textContent = "Last updated " + SITE.updated;
route();

/* ---------- 9. cursor dot(デスクトップのみ。ネイティブのカーソルは残す) ---------- */
if (matchMedia("(hover:hover) and (pointer:fine)").matches && !prefersReducedMotion()) {
  const dot = $("#cursor");
  let x = 0, y = 0, tx = 0, ty = 0, on = false;
  const loop = () => {
    x += (tx - x) * .15; y += (ty - y) * .15;
    dot.style.transform = `translate(${x + 10}px,${y + 10}px)`;
    requestAnimationFrame(loop);
  };
  addEventListener("mousemove", e => {
    tx = e.clientX; ty = e.clientY;
    if (!on) { on = true; dot.style.opacity = .6; x = tx; y = ty; loop(); }
  });
  document.addEventListener("mouseleave", () => { dot.style.opacity = 0; });
}
</script>
