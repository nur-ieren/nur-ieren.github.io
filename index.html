	  {label:"vrc-meikan",handle:"@nur_ieren",url:"https://vrc-meikan.com/profile/baa76819-ca5d-4151-84d0-ed0fb4140380",logo:"vrc-meikan.png"},
    {label:"X(Twitter)",handle:"@nur_ieren",url:"https://x.com/nur_ieren",logo:"X-logo.jpg"},
    {label:"My Skeb requests",handle:"@nur_ieren",url:"https://skeb.jp/@nur_ieren",logo:"skeb-logo.jpg"},
	  {label:"YouTube",handle:"@nur_ieren",url:"https://youtube.com/@nur_ieren",logo:"Youtube-logo.png"},
	  {label:"Spotify",handle:"@yy_yy",url:"https://open.spotify.com/user/31iul5uh5th7mbxnqrsp3tu4fjbe",logo:"spotify-logo.png"},
	  {label:"SoundCloud",handle:"@nur_ieren",url:"https://soundcloud.com/nur_ieren",logo:"soundcloud-logo.jpg"}
  ],
  log:[
    {date:"2026.11.08",text:"Link added, Photo feature added in Interests page, My favorite musics section added in Home page, Ramdom feature upgraded"},
    {date:"2026.11.02",text:"Experiments page deleted, Interests page updated"},
    {date:"2026.10.31",text:"Works added"},
    {date:"2026.10.29",text:"Icon changed"},
    {date:"2026.10.19",text:"Site created"}
  ]
};
const PAGES=[["home","Home"],["about","About"],["works","Works"],["interests","Interests"],["links","Links"]];
</script>

<button class="dots" id="open" aria-label="メニューを開く" aria-expanded="false" aria-controls="menu"><span>·</span><span>·</span><span>·</span></button>
<div class="overlay" id="overlay"></div>
<nav class="menu" id="menu" aria-label="Main" aria-hidden="true">
  <div class="menu-top"><span class="sub">MENU</span><button class="close" id="close">Close</button></div>
  <ul id="menulist"></ul>
</nav>
<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
<footer><div class="wrap"><span class="sub" id="copy"></span><span class="sub" id="upd"></span></div></footer>
<div class="cursor" id="cursor"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="画像の拡大表示" hidden>
  <button id="lbclose" aria-label="閉じる">×</button><button id="lbprev" aria-label="前の画像">‹</button><button id="lbnext" aria-label="次の画像">›</button>
  <figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure>
</div>

<script>
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const body=document.body,openBtn=$("#open"),menu=$("#menu");
/* menu */
$("#menulist").innerHTML=PAGES.map(([k,l],i)=>`<li style="--i:${i}"><a href="#/${k}" data-k="${k}">${l}</a></li>`).join("");
function setMenu(o){
  body.classList.toggle("menu-open",o);body.classList.toggle("lock",o);
  openBtn.setAttribute("aria-expanded",o);menu.setAttribute("aria-hidden",!o);
  menu.inert=!o;
  if(o)setTimeout(()=>menu.querySelector("a").focus(),60);else openBtn.focus({preventScroll:true});
}
menu.inert=true;
openBtn.onclick=()=>setMenu(true);$("#close").onclick=()=>setMenu(false);$("#overlay").onclick=()=>setMenu(false);
document.addEventListener("keydown",e=>{
  if(!body.classList.contains("menu-open"))return;
  if(e.key==="Escape")setMenu(false);
  if(e.key==="Tab"){const f=[...menu.querySelectorAll("button,a")],a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
/* templates */
const workCard=w=>{const T=w.url?"a":"div",h=w.url?` href="${esc(w.url)}" target="_blank" rel="noopener"`:"";
 return `<${T} class="card"${h} data-k="w:${esc(w.title)}"><div class="thumb">${w.image?`<img src="${esc(w.image)}" alt="" loading="lazy">`:"NO IMAGE"}</div><span class="sub">${esc(w.date)} / <span class="status">${esc(w.status)}</span></span><h3>${esc(w.title)}</h3><p>${esc(w.description)}</p>${(w.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</${T}>`};
const head=(t,l)=>`<h1>${t}</h1><p class="lead">${l}</p>`;
const link=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:t;
const spEmbed=u=>{try{const x=new URL(u);if(x.hostname!=="open.spotify.com")return"";let p=x.pathname.replace(/^\/intl-[a-zA-Z-]+/,"");if(!p.startsWith("/embed/"))p="/embed"+p;return"https://open.spotify.com"+p+"?utm_source=generator"}catch(e){return""}};
const music=()=>`<section class="blk"><h2 class="sec">My favorite musics</h2><div class="music">${(SITE.music||[]).map(m=>{const e=spEmbed(m.url);return e?`<iframe class="sp" src="${esc(e)}" height="${+m.height||352}" title="${esc(m.title||"Spotify")}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`:`<div class="sp-empty"><b>${esc(m.title||"Spotify")}</b><span class="sub">Spotify URL 未設定</span></div>`}).join("")}</div></section>`;
const pics=a=>{a=(a||[]).filter(x=>x&&x.src);return a.length?`<div class="pics">${a.map(x=>`<button type="button" class="pic" data-src="${esc(x.full||x.src)}" data-cap="${esc(x.caption??x.alt)}" aria-label="${esc(x.alt||"画像")}を拡大"><img src="${esc(x.src)}" alt="${esc(x.alt)}" loading="lazy"></button>`).join("")}</div>`:""};
const logo=l=>l.logo?`<i class="ico"><img src="${esc(l.logo)}" alt="" loading="lazy"></i>`:`<i class="ico ph" aria-hidden="true">${esc([...String(l.label||"?")][0].toUpperCase())}</i>`;
const R={
home:()=>{const S=SITE,f=S.works.filter(w=>w.featured);
 return `<div class="home stagger"><div class="avatar" style="--i:0">${S.avatarImage?`<img src="${esc(S.avatarImage)}" alt="">`:esc(S.initial)}</div>
 <h1 class="name" style="--i:1">${esc(S.name)}</h1><div class="phon sub" style="--i:2">${esc(S.phonetic)}</div><p class="intro" style="--i:3">${esc(S.tagline)}</p></div>
 <section class="blk"><h2 class="sec">Selected Works<a class="sub" href="#/works">all works</a></h2><div class="grid">${f.map(workCard).join("")}</div></section>
 <section class="blk"><h2 class="sec">Discovery</h2><div class="grid">
 <a class="card" href="#/about"><h3>About</h3><p>プロフィールと年表</p></a>
 <a class="card" href="#/interests"><h3>Interests</h3><p>気になっていること</p></a>
 <div class="card"><h3>Random</h3><p>サイト内から1つ紹介します。</p><button class="rand" id="rand">Show one</button><div id="disc" aria-live="polite"></div></div></div></section>
 ${music()}
 <section class="blk"><h2 class="sec">Log</h2><div class="rows">${S.log.map(l=>`<div class="row" style="display:flex;gap:1rem;font-size:.875rem"><span class="sub">${esc(l.date)}</span><span>${esc(l.text)}</span></div>`).join("")}</div></section>`},
about:()=>{const a=SITE.about;return `<div class="page">${head("About","自己紹介と、これまでのこと。")}<div class="prose">${a.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
 <section class="blk"><h2 class="sec">Currently</h2><div class="prose">${a.now.map(p=>`<p>${esc(p)}</p>`).join("")}</div></section>
 <section class="blk"><h2 class="sec">Archive</h2><ul class="tl">${a.timeline.map(t=>`<li><span class="sub">${esc(t.date)}</span><span>${esc(t.text)}</span></li>`).join("")}</ul></section></div>`},
works:()=>{const tags=[...new Set(SITE.works.flatMap(w=>w.tags||[]))];
 return `<div class="page">${head("Works","制作物と取り組み。")}<div class="filters" id="flt"><button aria-pressed="true" data-t="">All</button>${tags.map(t=>`<button aria-pressed="false" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div><div class="grid" id="wg">${SITE.works.map(workCard).join("")}</div></div>`},
interests:()=>`<div class="page">${head("Interests","何に興味があるのかの整理。")}${SITE.interests.map(c=>`<section class="blk" style="margin-top:2rem"><h2 class="sec">${esc(c.category)}</h2><div class="rows">${c.items.map(i=>`<div class="irow" data-k="i:${esc(i.label)}"><div class="itxt"><b style="font-weight:500">${link(i.url,esc(i.label))}</b><div class="sub">${esc(i.note)}</div></div>${pics(i.images)}</div>`).join("")}</div></section>`).join("")}</div>`,
links:()=>`<div class="page">${head("Elsewhere","外部アカウント。")}<div class="rows">${SITE.links.map(l=>l.url?`<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="lk">${logo(l)}${esc(l.label)}</span><span>${esc(l.handle)}</span></a>`:`<div class="row" style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0;border-bottom:1px solid var(--color-line);font-size:.875rem"><span class="lk">${logo(l)}${esc(l.label)}</span><span class="sub">${esc(l.handle)}</span></div>`).join("")}</div></div>`
};
/* lightbox */
const lb=$("#lb"),lbImg=$("#lbimg");let lbList=[],lbIdx=0,lbFrom=null;
function lbShow(i){lbIdx=(i+lbList.length)%lbList.length;const b=lbList[lbIdx];lbImg.src=b.dataset.src;$("#lbcap").textContent=b.dataset.cap||"";lb.classList.toggle("single",lbList.length<2)}
function lbOpen(b){lbList=[...b.closest(".pics").querySelectorAll(".pic")];lbFrom=b;lb.hidden=false;body.classList.add("lock");lbShow(lbList.indexOf(b));$("#lbclose").focus()}
function lbClose(){lb.hidden=true;lbImg.removeAttribute("src");body.classList.remove("lock");if(lbFrom)lbFrom.focus({preventScroll:true})}
document.addEventListener("click",e=>{
  const b=e.target.closest(".pic");if(b&&b.dataset.src){lbOpen(b);return}
  if(lb.hidden)return;
  if(e.target.closest("#lbprev"))lbShow(lbIdx-1);
  else if(e.target.closest("#lbnext"))lbShow(lbIdx+1);
  else if(e.target===lb||e.target.closest("#lbclose"))lbClose()});
document.addEventListener("keydown",e=>{if(lb.hidden)return;
  if(e.key==="Escape")lbClose();if(e.key==="ArrowLeft")lbShow(lbIdx-1);if(e.key==="ArrowRight")lbShow(lbIdx+1)});
/* router */
let goal=null; /* Randomで選ばれた項目。遷移後にその項目を画面最上部へ出す */
function route(){
 const k=(location.hash.replace(/^#\/?/,"")||"home");const key=R[k]?k:"home";
 const v=$("#view");v.style.paddingBottom="";v.innerHTML=`<div class="view">${R[key]()}</div>`;
 document.title=(key==="home"?"":PAGES.find(p=>p[0]===key)[1]+" | ")+SITE.name;
 document.querySelectorAll(".menu a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.k===key)||a.removeAttribute("aria-current"));
 document.querySelectorAll(".menu a").forEach(a=>{if(a.dataset.k===key)a.setAttribute("aria-current","page")});
 scrollTo(0,0);if(body.classList.contains("menu-open")){body.classList.remove("menu-open","lock");openBtn.setAttribute("aria-expanded",false);menu.inert=true}
 $("#main").focus({preventScroll:true});
 if(goal){const g=goal;goal=null;const el=[...v.querySelectorAll("[data-k]")].find(e=>e.dataset.k===g);
  if(el){const top=Math.max(0,el.getBoundingClientRect().top+scrollY-(parseFloat(getComputedStyle(el).scrollMarginTop)||0));
   const extra=top+innerHeight-document.documentElement.scrollHeight;if(extra>0)v.style.paddingBottom=extra+"px";scrollTo(0,top)}}
 const r=$("#rand");if(r)r.onclick=()=>{
  const pool=[...SITE.works.map(w=>["Works",w.title,w.description,"#/works","w:"+w.title]),...SITE.interests.flatMap(c=>c.items.map(i=>["Interests",i.label,i.note,"#/interests","i:"+i.label]))];
  const p=pool[Math.floor(Math.random()*pool.length)];
  $("#disc").innerHTML=`<span class="sub">${esc(p[0])}</span><div>${esc(p[1])}</div><a class="sub" href="${p[3]}" data-go="${esc(p[4])}">open</a>`;
  $("#disc").querySelector("[data-go]").onclick=e=>{goal=e.currentTarget.dataset.go}};
 const fl=$("#flt");if(fl)fl.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  fl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  const t=b.dataset.t;$("#wg").innerHTML=SITE.works.filter(w=>!t||(w.tags||[]).includes(t)).map(workCard).join("")};
}
addEventListener("hashchange",route);
$("#copy").textContent="© "+new Date().getFullYear()+" "+SITE.name;
$("#upd").textContent="Last updated "+SITE.updated;
route();
/* cursor dot (desktop only, native cursor kept) */
if(matchMedia("(hover:hover) and (pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
 const c=$("#cursor");let x=0,y=0,tx=0,ty=0,on=false;
 addEventListener("mousemove",e=>{tx=e.clientX;ty=e.clientY;if(!on){on=true;c.style.opacity=.6;x=tx;y=ty;loop()}});
 document.addEventListener("mouseleave",()=>c.style.opacity=0);
 function loop(){x+=(tx-x)*.15;y+=(ty-y)*.15;c.style.transform=`translate(${x+10}px,${y+10}px)`;requestAnimationFrame(loop)}
}
</script>
</body>
</html>
